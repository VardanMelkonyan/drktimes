name: ios-testflight
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
      - name: Render cue sounds and convert to .caf
        run: |
          python3 tool/make_cue_sounds.py
          mkdir -p ios/Runner/Sounds
          for f in assets/sounds/*.wav; do
            afconvert -f caff -d LEI16 "$f" "ios/Runner/Sounds/$(basename "${f%.wav}").caf"
          done
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Install App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
      - name: Build ipa (automatic signing with the API key)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          flutter build ipa --release \
            --export-options-plist ios/ExportOptions.plist \
            --build-number ${{ github.run_number }} \
            --dart-define=COMMUNITY_URL=${{ vars.COMMUNITY_URL }} --dart-define=COMMUNITY_KEY=${{ vars.COMMUNITY_KEY }}
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app --type ios \
            --file build/ios/ipa/*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
