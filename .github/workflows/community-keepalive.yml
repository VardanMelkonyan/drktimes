name: community-keepalive
# Keeps the free Supabase project from pausing for inactivity (spec 002, FR-022).
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call community_feed
        env:
          URL: ${{ vars.COMMUNITY_URL }}
          KEY: ${{ vars.COMMUNITY_KEY }}
        run: |
          test -n "$URL" -a -n "$KEY"
          curl -fsS -X POST "$URL/rest/v1/rpc/community_feed" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}' -o /dev/null
