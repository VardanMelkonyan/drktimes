<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Session · Done</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./drk.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="drk th-{{theme}}" style="width: 390px; height: 844px; padding: 59px 20px 34px; display: flex; flex-direction: column; gap: 16px">
<div class="appbar">
<span class="tag c1" style="font-size: 14px"><span class="tg t1g"></span>Tank 1</span>
<span class="sm mut" style="flex: 1; text-align: right">Tri-X 400 · Rodinal 1+50</span>
</div>
<div class="prog">
<div><div class="bar done"></div><span class="lbl">Dev</span></div>
<div><div class="bar done"></div><span class="lbl">Stop</span></div>
<div><div class="bar done"></div><span class="lbl">Fix</span></div>
<div><div class="bar done"></div><span class="lbl">Wash</span></div>
<div><div class="bar done"></div><span class="lbl">Wet</span></div>
</div>

<div class="row" style="justify-content: space-between; margin-top: 6px">
<span class="chip" style="border-width: 2px"><svg class="ic s" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>Done</span>
<span class="sm mut">19:42 → 20:07</span>
</div>
<div class="row" style="align-items: baseline; justify-content: space-between">
<h1 class="dp">Hang it to dry.</h1>
<span class="tm w5">25:12</span>
</div>

<div class="box" style="padding: 2px 14px">
<div class="kv" style="min-height: 40px"><span class="sm">Developer</span><span class="sm w7">13:30 <span class="mut w4">(+0:30)</span></span></div>
<div class="kv" style="min-height: 40px"><span class="sm">Stop bath</span><span class="sm w7">1:00</span></div>
<div class="kv" style="min-height: 40px"><span class="sm">Fixer</span><span class="sm w7">5:00</span></div>
<div class="kv" style="min-height: 40px"><span class="sm">Wash · Ilford</span><span class="sm w7">5 · 10 · 20</span></div>
<div class="kv" style="min-height: 40px; border-bottom: 0"><span class="sm">Wetting agent</span><span class="sm w7">0:30</span></div>
</div>

<div class="col" style="gap: 8px">
<label class="lbl fg" for="done-note">Add a note</label>
<textarea id="done-note" class="field" placeholder="How did it turn out?" style="min-height: 88px"></textarea>
</div>

<div class="col" style="gap: 10px; margin-top: auto">
<button class="btn btn-p btn-l">Save note</button>
<button class="btn" style="border-color: transparent; color: var(--mut)">Skip, back home</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","red"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
