<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Session · Agitate</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./drk.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="drk th-{{theme}}" style="width: 390px; height: 844px; padding: 59px 20px 34px; display: flex; flex-direction: column; gap: 16px">
<div class="appbar">
<span class="tag c1" style="font-size: 14px"><span class="tg t1g"></span>Tank 1</span>
<span class="sm mut" style="flex: 1; text-align: right; padding-right: 4px">Tri-X 400 · Rodinal 1+50</span>
<button class="ib" aria-label="Start another tank"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<div class="prog">
<div class="now"><div class="bar" style="background: linear-gradient(90deg, var(--fg) 16%, var(--ln2) 16%)"></div><span class="lbl">Dev</span></div>
<div><div class="bar"></div><span class="lbl">Stop</span></div>
<div><div class="bar"></div><span class="lbl">Fix</span></div>
<div><div class="bar"></div><span class="lbl">Wash</span></div>
<div><div class="bar"></div><span class="lbl">Wet</span></div>
</div>

<div class="f1" style="border-radius: 3px; overflow: hidden; display: flex; flex-direction: column">
<div class="beat" style="height: 14px; background: var(--inv)"></div>
<div style="padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div class="row" style="justify-content: space-between">
<span class="chip" style="border: 2px solid var(--inv)"><span class="g g-di beat"></span>Agitate</span>
<span class="sm w7">burst · 0:04 left</span>
</div>
<div class="row" style="align-items: baseline; gap: 12px"><span class="tl w8">3</span><span class="ti">/ 5 inversions</span></div>
<div class="pips" style="grid-template-columns: repeat(5, minmax(0, 1fr))"><div class="pip on"></div><div class="pip on"></div><div class="pip on beat"></div><div class="pip"></div><div class="pip"></div></div>
</div>
</div>

<div class="col" style="gap: 8px; margin-top: 4px">
<span class="lbl fg">Developer · left</span>
<div class="tx w8">10:54</div>
<div style="display: flex"><div class="ticks-on" style="width: 16%"></div><div class="ticks" style="flex: 1"></div></div>
</div>

<div class="col sm" style="gap: 4px; margin-top: auto; padding-top: 10px; border-top: 1px dashed var(--ln2)">
<div class="row" style="gap: 8px"><span class="lbl">Then</span><span class="w7">Rest 0:50</span></div>
<div class="row" style="gap: 8px"><span class="lbl">Next step</span><span class="w7">Stop bath 1:00</span></div>
</div>
<div class="ctl">
<button aria-label="Take 30 seconds off">−30 s</button>
<button><svg class="ic s" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"></path></svg>Pause</button>
<button aria-label="Add 30 seconds">+30 s</button>
<button style="color: var(--mut)">Abort</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","red"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
