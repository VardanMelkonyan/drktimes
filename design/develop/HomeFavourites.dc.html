<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home · Favourites</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./drk.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="drk th-{{theme}}" style="width: 390px; height: 844px; padding: 59px 20px 34px; display: flex; flex-direction: column; gap: 16px">
<div class="appbar">
<span class="wm">drktimes<span class="cur"></span></span>
<button class="ib nb" aria-label="Settings"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9M15 4v6M9 14v6"></path></svg></button>
</div>
<nav class="modes" aria-label="Mode"><button class="on" aria-pressed="true">Develop</button><button aria-pressed="false">Print</button></nav>
<div class="seg" style="grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 4px"><button class="on">Favourites</button><button>Recent</button><button>Search</button></div>

<div style="display: flex; flex-direction: column; margin-top: 4px">
<div class="sect lbl" style="margin-bottom: 2px">4 starred</div>
<button class="li">
<span class="idx">01</span>
<span class="col sp"><span class="w7">Kodak Tri-X 400</span><span class="sm mut">Rodinal 1+50 · ISO 400 · 20 °C</span></span>
<span class="tm" style="font-size: 28px">13:00</span>
</button>
<button class="li">
<span class="idx">02</span>
<span class="col sp"><span class="w7">Ilford HP5 Plus</span><span class="sm mut">D-76 stock · ISO 400 · 20 °C</span></span>
<span class="tm" style="font-size: 28px">7:45</span>
</button>
<button class="li">
<span class="idx">03</span>
<span class="col sp"><span class="w7">Ilford HP5 Plus</span><span class="sm mut">D-76 stock · ISO 800 push +1 · 20 °C</span></span>
<span class="tm" style="font-size: 28px">9:30</span>
</button>
<button class="li">
<span class="idx">04</span>
<span class="col sp"><span class="w7">Fomapan 100</span><span class="sm mut">Ilfosol 3 1+9 · ISO 100 · 20 °C</span></span>
<span class="tm" style="font-size: 28px">6:30</span>
</button>
</div>

<button class="btn btn-o btn-l" style="margin-top: auto"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Find a combination</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","red"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
