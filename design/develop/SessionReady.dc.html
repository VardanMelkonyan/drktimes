<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Session · Ready to pour</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./drk.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="drk th-{{theme}}" style="width: 390px; height: 844px; padding: 59px 20px 34px; display: flex; flex-direction: column; gap: 16px">
<div class="appbar">
<span class="tag c1" style="font-size: 14px"><span class="tg t1g"></span>Tank 1</span>
<span class="sm mut" style="flex: 1; text-align: right; padding-right: 4px">Tri-X 400 · Rodinal 1+50</span>
<button class="ib" aria-label="Start another tank"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<div class="prog">
<div class="now"><div class="bar"></div><span class="lbl">Dev</span></div>
<div><div class="bar"></div><span class="lbl">Stop</span></div>
<div><div class="bar"></div><span class="lbl">Fix</span></div>
<div><div class="bar"></div><span class="lbl">Wash</span></div>
<div><div class="bar"></div><span class="lbl">Wet</span></div>
</div>

<span class="chip" style="align-self: flex-start; margin-top: 6px"><span class="g g-sq"></span>Ready</span>
<h1 class="dp" style="font-size: 34px; line-height: 38px">Pour developer</h1>
<div class="box" style="padding: 14px 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div class="col" style="grid-column: span 2"><span class="sm mut">Rodinal 1+50 · 300 ml · 20 °C</span></div>
<div class="col" style="gap: 4px"><span class="tm" style="font-size: 26px">5.9</span><span class="lbl">ml concentrate</span></div>
<div class="col" style="gap: 4px"><span class="tm" style="font-size: 26px">294.1</span><span class="lbl">ml water</span></div>
</div>

<div class="col" style="gap: 6px; margin-top: 4px">
<span class="lbl">Developer · will run</span>
<div class="tx w4 mut">13:00</div>
<span class="sm mut">Starts with 30 s of agitation</span>
</div>

<div class="row sm" style="gap: 8px; margin-top: auto; padding-top: 10px; border-top: 1px dashed var(--ln2)"><span class="lbl">Then</span><span class="w7">Stop bath 1:00</span></div>
<button class="btn btn-p btn-xl">Start</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","red"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
