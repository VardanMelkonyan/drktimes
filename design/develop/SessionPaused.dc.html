<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Session · Paused</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./drk.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="drk th-{{theme}}" style="width: 390px; height: 844px; padding: 59px 20px 34px; display: flex; flex-direction: column; gap: 16px">
<div class="appbar">
<span class="tag c1" style="font-size: 14px"><span class="tg t1g"></span>Tank 1</span>
<span class="sm mut" style="flex: 1; text-align: right; padding-right: 4px">Tri-X 400 · Rodinal 1+50</span>
<button class="ib" aria-label="Start another tank"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<div class="stripes" style="height: 18px; border-radius: 2px" aria-hidden="true"></div>

<div class="row" style="justify-content: space-between">
<span class="chip chip-z"><span class="in"><span class="g g-ba"></span>Paused</span></span>
<span class="col" style="align-items: flex-end"><span class="tm w8" style="font-size: 30px">0:23</span><span class="lbl">paused for</span></span>
</div>
<h1 class="dp" style="font-size: 30px; line-height: 36px">The chemistry is still working.</h1>
<p class="bd mut">The developer keeps developing while the timer is stopped. Resume as soon as you can, and take the extra time off with −30 s.</p>

<div class="col" style="gap: 8px; margin-top: 4px">
<span class="lbl">Developer · stopped at</span>
<div class="tx w4 mut">10:12</div>
</div>

<div class="ctl" style="margin-top: auto; grid-template-columns: repeat(3, minmax(0, 1fr))">
<button aria-label="Take 30 seconds off">−30 s</button>
<button aria-label="Add 30 seconds">+30 s</button>
<button style="color: var(--mut)">Abort</button>
</div>
<button class="btn btn-p btn-xl">Resume</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","red"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
