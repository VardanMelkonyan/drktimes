<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Import · new recipe</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./drk.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="drk th-{{theme}}" style="width: 390px; height: 844px; padding: 59px 20px 34px; display: flex; flex-direction: column; gap: 18px">
<div class="appbar">
<button class="ib nb" aria-label="Close"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
<span class="lbl fg">Import</span>
<span style="width: 44px"></span>
</div>

<div class="col" style="gap: 6px">
<span class="chip" style="align-self: flex-start"><span class="g g-sq"></span>New to you</span>
<h1 class="dp" style="margin-top: 8px">Davit's recipe</h1>
</div>

<div class="box" style="padding: 18px; display: flex; flex-direction: column; gap: 12px">
<div class="col" style="gap: 2px"><span class="ti">Ilford HP5 Plus</span><span class="sm mut">Ilfosol 3 1+9 · ISO 400 · 20 °C</span></div>
<div class="tl">7:45</div>
<span class="sm mut">Intermittent · own process · 2 notes</span>
</div>

<div class="col" style="gap: 0">
<div class="sect lbl" style="margin-bottom: 4px">Notes · 2</div>
<div class="col" style="gap: 6px; padding: 12px 0; border-bottom: 1px dashed var(--ln2)">
<span class="lbl">Davit K. · 12 Oct 2026</span>
<p class="sm">One-shot, 300 ml for one 35mm roll. Agitate 10 s every minute.</p>
</div>
<div class="col" style="gap: 6px; padding: 12px 0; border-bottom: 1px dashed var(--ln2)">
<span class="lbl">Davit K. · 19 Oct 2026</span>
<p class="sm">Shadows open up nicely. Hard light needs 15 s less.</p>
</div>
</div>

<div class="col" style="gap: 10px; margin-top: auto">
<button class="btn btn-p btn-l">Import</button>
<button class="btn" style="border-color: transparent; color: var(--mut)">Not now</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","red"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
