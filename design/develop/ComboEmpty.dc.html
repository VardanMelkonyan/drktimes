<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Combination · no published time</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./drk.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="drk th-{{theme}}" style="width: 390px; height: 844px; padding: 59px 20px 34px; display: flex; flex-direction: column; gap: 16px">
<div class="appbar">
<button class="ib nb" aria-label="Back"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"></path></svg></button>
<span class="lbl">Combination</span>
<span style="width: 44px"></span>
</div>
<div class="col" style="gap: 6px; padding-bottom: 16px; border-bottom: 2px solid var(--fg)">
<h1 class="ti">Fomapan 100 · Adox XT-3</h1>
<span class="sm mut">ISO 100 · 20 °C</span>
</div>

<div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 20px">
<div class="tx dim" aria-hidden="true" style="font-weight: 300">--:--</div>
<h2 class="dp">No published time for this combination.</h2>
<p class="bd mut">Add the time you use and it becomes the time to use here. You can share it with others later.</p>
</div>

<div class="col" style="gap: 10px">
<button class="btn btn-p btn-l"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add yours</button>
<button class="btn btn-q" style="border-color: transparent">Pick another developer</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","red"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
