<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home · Recent</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./drk.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="drk th-{{theme}}" style="width: 390px; height: 844px; padding: 59px 20px 34px; display: flex; flex-direction: column; gap: 16px">
<div class="appbar">
<span class="wm">drktimes<span class="cur"></span></span>
<button class="ib nb" aria-label="Settings"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9M15 4v6M9 14v6"></path></svg></button>
</div>
<nav class="modes" aria-label="Mode"><button class="on" aria-pressed="true">Develop</button><button aria-pressed="false">Print</button></nav>

<button class="tank" style="width: 100%; text-align: left; color: var(--fg); cursor: pointer; border-color: var(--t1); border-width: 2px">
<span class="tag c1"><span class="tg t1g"></span>T1</span>
<span class="col" style="min-width: 0"><span class="sm w7">Running · Fixer</span><span class="sm mut">HP5 Plus · D-76 stock</span></span>
<span class="row" style="gap: 8px"><span class="tm" style="font-size: 28px">3:12</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"></path></svg></span>
</button>

<div class="seg" style="grid-template-columns: repeat(3, minmax(0, 1fr))"><button>Favourites</button><button class="on">Recent</button><button>Search</button></div>

<div style="display: flex; flex-direction: column">
<button class="li" style="align-items: flex-start">
<span class="col sp" style="gap: 3px">
<span class="row lbl" style="gap: 8px">Today 19:42 <span class="tag c1" style="font-size: 11px"><span class="tg t1g" style="width: 9px; height: 9px"></span>Tank 1</span></span>
<span class="w7">Kodak Tri-X 400</span>
<span class="sm mut">Rodinal 1+50 · ISO 400 · 20 °C · 13:00</span>
<span class="row sm w7" style="gap: 6px; margin-top: 2px"><svg class="ic s" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>Completed</span>
</span>
<span class="lbl" style="padding-top: 2px">Run again</span>
</button>
<button class="li" style="align-items: flex-start">
<span class="col sp" style="gap: 3px">
<span class="row lbl" style="gap: 8px">Yesterday 21:10 <span class="tag c2" style="font-size: 11px"><span class="tg t2g" style="width: 9px; height: 9px"></span>Tank 2</span></span>
<span class="w7">Ilford HP5 Plus</span>
<span class="sm mut">D-76 stock · ISO 800 push +1 · 20 °C · 9:30</span>
<span class="row sm w7" style="gap: 6px; margin-top: 2px"><svg class="ic s" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>Aborted at Fixer</span>
</span>
<span class="lbl" style="padding-top: 2px">Run again</span>
</button>
<button class="li" style="align-items: flex-start">
<span class="col sp" style="gap: 3px">
<span class="row lbl" style="gap: 8px">18 Oct 20:09 <span class="tag c2" style="font-size: 11px"><span class="tg t2g" style="width: 9px; height: 9px"></span>Tank 2</span></span>
<span class="w7">Ilford HP5 Plus</span>
<span class="sm mut">D-76 stock · ISO 400 · 20 °C · 7:45</span>
<span class="row sm w7" style="gap: 6px; margin-top: 2px"><svg class="ic s" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>Completed</span>
</span>
<span class="lbl" style="padding-top: 2px">Run again</span>
</button>
<button class="li" style="align-items: flex-start">
<span class="col sp" style="gap: 3px">
<span class="row lbl" style="gap: 8px">18 Oct 20:05 <span class="tag c1" style="font-size: 11px"><span class="tg t1g" style="width: 9px; height: 9px"></span>Tank 1</span></span>
<span class="w7">Fomapan 100</span>
<span class="sm mut">Ilfosol 3 1+9 · ISO 100 · 20 °C · 6:30</span>
<span class="row sm w7" style="gap: 6px; margin-top: 2px"><svg class="ic s" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>Completed</span>
</span>
<span class="lbl" style="padding-top: 2px">Run again</span>
</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","red"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
