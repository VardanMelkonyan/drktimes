<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Session · Last 10 seconds</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./drk.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="drk th-{{theme}}" style="width: 390px; height: 844px; padding: 59px 20px 34px; display: flex; flex-direction: column; gap: 16px">
<div class="appbar">
<span class="tag c1" style="font-size: 14px"><span class="tg t1g"></span>Tank 1</span>
<span class="sm mut" style="flex: 1; text-align: right; padding-right: 4px">Tri-X 400 · Rodinal 1+50</span>
<button class="ib" aria-label="Start another tank"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<div class="prog">
<div class="now"><div class="bar" style="background: linear-gradient(90deg, var(--fg) 99%, var(--ln2) 99%)"></div><span class="lbl">Dev</span></div>
<div><div class="bar"></div><span class="lbl">Stop</span></div>
<div><div class="bar"></div><span class="lbl">Fix</span></div>
<div><div class="bar"></div><span class="lbl">Wash</span></div>
<div><div class="bar"></div><span class="lbl">Wet</span></div>
</div>

<span class="chip chip-h" style="align-self: flex-start; margin-top: 6px"><span class="in">! Last 10 s</span></span>
<h1 class="dp" style="font-size: 30px; line-height: 36px">Get ready to dump developer.</h1>

<div class="hatch" style="padding: 8px; border-radius: 3px">
<div style="background: var(--bg); border-radius: 2px; padding: 16px 14px 18px; display: flex; flex-direction: column; gap: 14px">
<span class="lbl fg">Developer · left</span>
<div class="tx w8" style="font-size: 136px">0:07</div>
<div class="pips" style="grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px">
<div class="pip on" style="height: 22px"></div><div class="pip on" style="height: 22px"></div><div class="pip on" style="height: 22px"></div><div class="pip on" style="height: 22px"></div><div class="pip on" style="height: 22px"></div><div class="pip on" style="height: 22px"></div><div class="pip on beat" style="height: 22px"></div><div class="pip" style="height: 22px; border-color: var(--ln2)"></div><div class="pip" style="height: 22px; border-color: var(--ln2)"></div><div class="pip" style="height: 22px; border-color: var(--ln2)"></div>
</div>
</div>
</div>

<div class="col sm" style="gap: 4px; margin-top: auto; padding-top: 10px; border-top: 1px dashed var(--ln2)">
<div class="row" style="gap: 8px"><span class="lbl">Then</span><span class="w7">Dump developer → pour stop bath</span></div>
</div>
<div class="ctl">
<button aria-label="Take 30 seconds off">−30 s</button>
<button><svg class="ic s" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"></path></svg>Pause</button>
<button aria-label="Add 30 seconds">+30 s</button>
<button style="color: var(--mut)">Abort</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","red"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
