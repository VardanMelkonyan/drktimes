<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Same screens in three themes</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./drk.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="drk th-dark" style="width: 1458px; height: 2060px; padding: 56px 64px; display: flex; flex-direction: column; gap: 32px">
<header style="display: flex; justify-content: space-between; align-items: flex-end; gap: 40px; padding-bottom: 20px; border-bottom: 2px solid var(--fg)">
<h1 style="font-size: 44px; line-height: 1; font-weight: 800; letter-spacing: -0.04em">Light · Dark · Safelight red</h1>
<p class="sm mut" style="max-width: 460px">The same two screens, only the theme tokens swapped. Every state and every tank stays readable when the hue is gone.</p>
</header>

<div style="display: grid; grid-template-columns: repeat(3, 390px); gap: 40px">
<div class="col" style="gap: 14px"><span class="lbl fg">Light · agitate</span><div style="width: 390px; height: 844px; border-radius: 40px; overflow: hidden"><dc-import name="SessionAgitate" theme="light" hint-size="390px,844px"></dc-import></div></div>
<div class="col" style="gap: 14px"><span class="lbl fg">Dark · agitate</span><div style="width: 390px; height: 844px; border-radius: 40px; overflow: hidden; outline: 1px solid var(--ln2)"><dc-import name="SessionAgitate" theme="dark" hint-size="390px,844px"></dc-import></div></div>
<div class="col" style="gap: 14px"><span class="lbl fg">Safelight red · agitate</span><div style="width: 390px; height: 844px; border-radius: 40px; overflow: hidden; outline: 1px solid var(--ln2)"><dc-import name="SessionAgitate" theme="red" hint-size="390px,844px"></dc-import></div></div>
</div>

<div style="display: grid; grid-template-columns: repeat(3, 390px); gap: 40px">
<div class="col" style="gap: 14px"><span class="lbl fg">Light · 2 tanks waiting</span><div style="width: 390px; height: 844px; border-radius: 40px; overflow: hidden"><dc-import name="MultiBothWaiting" theme="light" hint-size="390px,844px"></dc-import></div></div>
<div class="col" style="gap: 14px"><span class="lbl fg">Dark · 2 tanks waiting</span><div style="width: 390px; height: 844px; border-radius: 40px; overflow: hidden; outline: 1px solid var(--ln2)"><dc-import name="MultiBothWaiting" theme="dark" hint-size="390px,844px"></dc-import></div></div>
<div class="col" style="gap: 14px"><span class="lbl fg">Safelight red · 2 tanks waiting</span><div style="width: 390px; height: 844px; border-radius: 40px; overflow: hidden; outline: 1px solid var(--ln2)"><dc-import name="MultiBothWaiting" theme="red" hint-size="390px,844px"></dc-import></div></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1458,"height":2060}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
