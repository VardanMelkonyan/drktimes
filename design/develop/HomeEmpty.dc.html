<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home · first launch</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./drk.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="drk th-{{theme}}" style="width: 390px; height: 844px; padding: 59px 20px 34px; display: flex; flex-direction: column; gap: 16px">
<div class="appbar">
<span class="wm">drktimes<span class="cur"></span></span>
<button class="ib nb" aria-label="Settings"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9M15 4v6M9 14v6"></path></svg></button>
</div>
<nav class="modes" aria-label="Mode"><button class="on" aria-pressed="true">Develop</button><button aria-pressed="false">Print</button></nav>
<div class="seg" style="grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 4px"><button class="on">Favourites</button><button>Recent</button><button>Search</button></div>

<div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 0 8px">
<div style="width: 72px; height: 72px; border: 2px dashed var(--ln2); border-radius: 3px; display: flex; align-items: center; justify-content: center">
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 36px; height: 36px; stroke-width: 1.5"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8L3.5 9.7l5.9-.8z"></path></svg>
</div>
<h2 class="dp">No favourites yet</h2>
<p class="bd mut">Star a film and developer combination and it lives here, one tap from Start.</p>
<div class="dash" style="margin-top: 6px"></div>
<p class="sm mut"><span class="lbl fg">Recent · empty</span><br>Every run you finish or abort shows up in Recent, ready to run again.</p>
</div>

<button class="btn btn-p btn-l"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="m20 20-4.5-4.5"></path></svg>Find a combination</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","red"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
