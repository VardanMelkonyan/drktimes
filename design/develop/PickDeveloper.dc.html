<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pick 2 · Developer</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./drk.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="drk th-{{theme}}" style="width: 390px; height: 844px; padding: 59px 20px 34px; display: flex; flex-direction: column; gap: 16px">
<div class="appbar">
<button class="ib nb" aria-label="Back"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"></path></svg></button>
<span class="lbl fg">Step 2 / 4</span>
<button class="ib nb" aria-label="Close"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</div>
<div class="wiz">
<div><div class="bar done"></div><span class="lbl">Film</span></div>
<div class="now"><div class="bar done"></div><span class="lbl">Developer</span></div>
<div><div class="bar"></div><span class="lbl">ISO</span></div>
<div><div class="bar"></div><span class="lbl">Dil · temp</span></div>
</div>
<div class="col" style="gap: 4px">
<span class="lbl">Kodak Tri-X 400</span>
<h1 class="dp">Which developer?</h1>
</div>

<div style="display: flex; flex-direction: column">
<div class="sect lbl">Published times · 4</div>
<button class="li" style="min-height: 56px; padding: 10px 0">
<span class="col sp"><span class="w7">Rodinal</span><span class="sm mut">1+25 · 1+50 · 1+100</span></span>
<span class="sm mut">4 times</span>
</button>
<button class="li" style="min-height: 56px; padding: 10px 0">
<span class="col sp"><span class="w7">Kodak D-76</span><span class="sm mut">stock · 1+1</span></span>
<span class="sm mut">3 times</span>
</button>
<button class="li" style="min-height: 56px; padding: 10px 0">
<span class="col sp"><span class="w7">Kodak HC-110</span><span class="sm mut">dilution B · H</span></span>
<span class="sm mut">2 times</span>
</button>
<button class="li" style="min-height: 56px; padding: 10px 0">
<span class="col sp"><span class="w7">Ilfosol 3</span><span class="sm mut">1+9 · 1+14</span></span>
<span class="sm mut">1 time</span>
</button>
</div>

<div style="display: flex; flex-direction: column">
<div class="sect lbl">No published time</div>
<button class="li" style="min-height: 52px; padding: 10px 0; color: var(--mut)">
<span class="sp">Adox XT-3</span>
<span class="sm">add your own →</span>
</button>
<button class="li" style="min-height: 52px; padding: 10px 0; color: var(--mut)">
<span class="sp">Caffenol-C</span>
<span class="sm">add your own →</span>
</button>
</div>

<button class="btn btn-l" style="margin-top: auto"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add a developer</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","red"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
