<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Two tanks · one agitates, one rests</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./drk.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="drk th-{{theme}}" style="width: 390px; height: 844px; padding: 59px 20px 34px; display: flex; flex-direction: column; gap: 14px">
<div class="appbar">
<span class="lbl fg">2 tanks running</span>
<button class="ib" aria-label="Start another tank"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>

<button class="tank" style="width: 100%; text-align: left; color: var(--fg); cursor: pointer">
<span class="tag c1"><span class="tg t1g"></span>T1</span>
<span class="col" style="min-width: 0"><span class="row sm w7" style="gap: 6px"><span class="g g-ri mut" style="width: 9px; height: 9px"></span>Developer · rest</span><span class="sm mut">HP5 · D-76 · agitate in 0:38</span></span>
<span class="tm w3">3:22</span>
</button>

<div class="col" style="gap: 12px; padding-top: 14px; border-top: 2px solid var(--t2)">
<div class="row" style="justify-content: space-between">
<span class="tag c2" style="font-size: 15px"><span class="tg t2g" style="width: 14px; height: 14px"></span>Tank 2</span>
<span class="sm mut">Tri-X 400 · Rodinal 1+50</span>
</div>
<div class="prog">
<div class="now"><div class="bar" style="background: linear-gradient(90deg, var(--fg) 2%, var(--ln2) 2%)"></div><span class="lbl">Dev</span></div>
<div><div class="bar"></div><span class="lbl">Stop</span></div>
<div><div class="bar"></div><span class="lbl">Fix</span></div>
<div><div class="bar"></div><span class="lbl">Wash</span></div>
<div><div class="bar"></div><span class="lbl">Wet</span></div>
</div>
</div>

<div class="f2" style="border-radius: 3px; overflow: hidden; display: flex; flex-direction: column">
<div class="beat" style="height: 12px; background: var(--inv)"></div>
<div style="padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px">
<div class="row" style="justify-content: space-between">
<span class="chip" style="border: 2px solid var(--inv)"><span class="tg t2g"></span>Tank 2 · agitate</span>
<span class="sm w7">0:14 left</span>
</div>
<div class="row" style="align-items: baseline; gap: 12px"><span class="tl w8">8</span><span class="ti">/ 15 inversions</span></div>
<div class="pips" style="grid-template-columns: repeat(15, minmax(0, 1fr)); gap: 3px">
<div class="pip on" style="height: 20px"></div><div class="pip on" style="height: 20px"></div><div class="pip on" style="height: 20px"></div><div class="pip on" style="height: 20px"></div><div class="pip on" style="height: 20px"></div><div class="pip on" style="height: 20px"></div><div class="pip on" style="height: 20px"></div><div class="pip on beat" style="height: 20px"></div><div class="pip" style="height: 20px"></div><div class="pip" style="height: 20px"></div><div class="pip" style="height: 20px"></div><div class="pip" style="height: 20px"></div><div class="pip" style="height: 20px"></div><div class="pip" style="height: 20px"></div><div class="pip" style="height: 20px"></div>
</div>
</div>
</div>

<div class="col" style="gap: 6px">
<span class="lbl fg">Tank 2 · developer · left</span>
<div class="tx w8">12:44</div>
</div>

<div class="col" style="gap: 8px; margin-top: auto">
<span class="lbl">Controls · Tank 2</span>
<div class="ctl">
<button aria-label="Tank 2: take 30 seconds off">−30 s</button>
<button aria-label="Pause Tank 2"><svg class="ic s" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"></path></svg>Pause</button>
<button aria-label="Tank 2: add 30 seconds">+30 s</button>
<button style="color: var(--mut)" aria-label="Abort Tank 2">Abort</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","red"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
