<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Three tanks · fourth blocked</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./drk.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="drk th-{{theme}}" style="width: 390px; height: 844px; padding: 59px 20px 34px; display: flex; flex-direction: column; gap: 12px">
<div class="appbar">
<span class="lbl fg">3 tanks running</span>
<button class="ib" aria-label="Start another tank" aria-disabled="true" style="color: var(--dim); border-style: dashed"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<div class="toast" role="status">
<span class="sm w7 sp">Three tanks is the most. Finish or abort one to start another.</span>
<button class="btn" aria-label="Dismiss" style="min-width: 44px; padding: 0 10px"><svg class="ic s" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</div>

<div class="col" style="gap: 8px">
<button class="tank" style="width: 100%; text-align: left; color: var(--fg); cursor: pointer; min-height: 64px">
<span class="tag c1"><span class="tg t1g"></span>T1</span>
<span class="col" style="min-width: 0"><span class="row sm w7" style="gap: 6px"><span class="g g-ri mut" style="width: 9px; height: 9px"></span>Fixer · rest</span><span class="sm mut">agitate in 0:20</span></span>
<span class="tm w3" style="font-size: 30px">2:10</span>
</button>
<button class="tank" style="width: 100%; text-align: left; color: var(--fg); cursor: pointer; min-height: 64px">
<span class="tag c2"><span class="tg t2g"></span>T2</span>
<span class="col" style="min-width: 0"><span class="row sm w7" style="gap: 6px"><span class="g g-ri mut" style="width: 9px; height: 9px"></span>Developer · rest</span><span class="sm mut">agitate in 0:44</span></span>
<span class="tm w3" style="font-size: 30px">6:40</span>
</button>
</div>

<div class="row" style="justify-content: space-between; padding-top: 12px; border-top: 2px solid var(--t3)">
<span class="tag c3" style="font-size: 15px"><span class="tg t3g" style="width: 14px; height: 14px"></span>Tank 3</span>
<span class="chip chip-h"><span class="in">! Last 10 s</span></span>
</div>

<div class="hatch" style="padding: 7px; border-radius: 3px">
<div style="background: var(--bg); border-radius: 2px; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px">
<div class="row" style="justify-content: space-between"><span class="lbl fg">Developer · left</span><span class="sm mut">Fomapan 100 · Ilfosol 3</span></div>
<div class="tx w8" style="font-size: 112px">0:06</div>
<div class="pips" style="grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px">
<div class="pip on" style="height: 18px"></div><div class="pip on" style="height: 18px"></div><div class="pip on" style="height: 18px"></div><div class="pip on" style="height: 18px"></div><div class="pip on" style="height: 18px"></div><div class="pip on beat" style="height: 18px"></div><div class="pip" style="height: 18px; border-color: var(--ln2)"></div><div class="pip" style="height: 18px; border-color: var(--ln2)"></div><div class="pip" style="height: 18px; border-color: var(--ln2)"></div><div class="pip" style="height: 18px; border-color: var(--ln2)"></div>
</div>
</div>
</div>

<div class="row sm" style="gap: 8px"><span class="lbl">Then</span><span class="w7">Tank 3 · dump developer → pour stop</span></div>

<div class="ctl" style="margin-top: auto">
<button aria-label="Tank 3: take 30 seconds off">−30 s</button>
<button aria-label="Pause Tank 3"><svg class="ic s" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"></path></svg>Pause</button>
<button aria-label="Tank 3: add 30 seconds">+30 s</button>
<button style="color: var(--mut)" aria-label="Abort Tank 3">Abort</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","red"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
