<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Two tanks · both agitating</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./drk.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="drk th-{{theme}}" style="width: 390px; height: 844px; padding: 59px 20px 34px; display: flex; flex-direction: column; gap: 12px">
<div class="appbar">
<span class="lbl fg">2 tanks · both agitating</span>
<button class="ib" aria-label="Start another tank"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>

<button class="f1" style="appearance: none; border: 0; padding: 0; text-align: left; cursor: pointer; border-radius: 3px; flex: 1; display: flex; flex-direction: column; overflow: hidden">
<span class="beat" style="display: block; height: 12px; background: var(--inv)"></span>
<span style="padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; flex: 1; width: 100%">
<span class="row" style="justify-content: space-between">
<span class="tag" style="font-size: 16px"><span class="tg t1g" style="width: 18px; height: 18px"></span>Tank 1</span>
<span class="chip" style="border: 2px solid var(--inv)"><span class="g g-di"></span>Agitate</span>
</span>
<span class="row" style="justify-content: space-between; align-items: flex-end">
<span class="row" style="align-items: baseline; gap: 8px"><span class="tl w8">2</span><span class="ti">/ 5</span></span>
<span class="col" style="align-items: flex-end; gap: 4px"><span class="tm w8">3:04</span><span class="sm w7">dev left</span></span>
</span>
<span class="pips" style="grid-template-columns: repeat(5, minmax(0, 1fr)); margin-top: auto"><span class="pip on"></span><span class="pip on beat"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></span>
<span class="row sm" style="justify-content: space-between"><span class="w7">HP5 Plus · D-76</span><span>burst 0:06 left</span></span>
</span>
</button>

<button class="f2" style="appearance: none; border: 0; padding: 0; text-align: left; cursor: pointer; border-radius: 3px; flex: 1; display: flex; flex-direction: column; overflow: hidden">
<span class="beat-off" style="display: block; height: 12px; background: var(--inv)"></span>
<span style="padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; flex: 1; width: 100%">
<span class="row" style="justify-content: space-between">
<span class="tag" style="font-size: 16px"><span class="tg t2g" style="width: 18px; height: 18px"></span>Tank 2</span>
<span class="chip" style="border: 2px solid var(--inv)"><span class="g g-di"></span>Agitate</span>
</span>
<span class="row" style="justify-content: space-between; align-items: flex-end">
<span class="row" style="align-items: baseline; gap: 8px"><span class="tl w8">4</span><span class="ti">/ 5</span></span>
<span class="col" style="align-items: flex-end; gap: 4px"><span class="tm w8">7:02</span><span class="sm w7">dev left</span></span>
</span>
<span class="pips" style="grid-template-columns: repeat(5, minmax(0, 1fr)); margin-top: auto"><span class="pip on"></span><span class="pip on"></span><span class="pip on"></span><span class="pip on beat-off"></span><span class="pip"></span></span>
<span class="row sm" style="justify-content: space-between"><span class="w7">Tri-X 400 · Rodinal</span><span>burst 0:02 left</span></span>
</span>
</button>

<p class="sm mut" style="text-align: center">Each tank beats on its own count. Tap one for its controls.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","red"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
