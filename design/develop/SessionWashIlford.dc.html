<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Session · Ilford wash</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./drk.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="drk th-{{theme}}" style="width: 390px; height: 844px; padding: 59px 20px 34px; display: flex; flex-direction: column; gap: 16px">
<div class="appbar">
<span class="tag c1" style="font-size: 14px"><span class="tg t1g"></span>Tank 1</span>
<span class="sm mut" style="flex: 1; text-align: right; padding-right: 4px">Tri-X 400 · Rodinal 1+50</span>
<button class="ib" aria-label="Start another tank"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<div class="prog">
<div><div class="bar done"></div><span class="lbl">Dev</span></div>
<div><div class="bar done"></div><span class="lbl">Stop</span></div>
<div><div class="bar done"></div><span class="lbl">Fix</span></div>
<div class="now"><div class="bar" style="background: linear-gradient(90deg, var(--fg) 45%, var(--ln2) 45%)"></div><span class="lbl">Wash</span></div>
<div><div class="bar"></div><span class="lbl">Wet</span></div>
</div>

<span class="chip" style="align-self: flex-start; margin-top: 6px"><span class="g g-wv"></span>Wash · Ilford method</span>

<div class="col">
<div class="row" style="gap: 12px; min-height: 48px; border-bottom: 1px dashed var(--ln2)">
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
<span class="sp mut">Fill 1 · 5 inversions</span><span class="sm mut">done</span>
</div>
<div style="margin: 10px 0; border: 2px solid var(--fg); border-radius: 3px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div class="row" style="justify-content: space-between"><span class="lbl fg">Fill 2 of 3</span><span class="lbl">invert</span></div>
<div class="row" style="align-items: baseline; gap: 10px"><span class="tx w8">6</span><span class="tl w3 mut">/10</span></div>
<div class="pips" style="grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px">
<div class="pip on" style="height: 26px"></div><div class="pip on" style="height: 26px"></div><div class="pip on" style="height: 26px"></div><div class="pip on" style="height: 26px"></div><div class="pip on" style="height: 26px"></div><div class="pip on beat" style="height: 26px"></div><div class="pip" style="height: 26px"></div><div class="pip" style="height: 26px"></div><div class="pip" style="height: 26px"></div><div class="pip" style="height: 26px"></div>
</div>
<span class="sm">4 more, then dump.</span>
</div>
<div class="row" style="gap: 12px; min-height: 48px; border-bottom: 1px dashed var(--ln2)">
<span class="g g-sq mut" style="margin: 0 4px"></span>
<span class="sp mut">Fill 3 · 20 inversions</span>
</div>
</div>

<button class="btn btn-o btn-xl" style="margin-top: auto; flex-direction: column; gap: 10px; min-height: 120px">
<span>Next</span>
<span class="tag" style="font-size: 12px"><span class="tg t1g"></span>Tank 1 · dumped, fill 3</span>
</button>
<div class="ctl" style="grid-template-columns: repeat(2, minmax(0, 1fr))">
<button><svg class="ic s" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"></path></svg>Pause</button>
<button style="color: var(--mut)">Abort</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","red"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
