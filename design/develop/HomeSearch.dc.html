<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home · Search</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./drk.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="drk th-{{theme}}" style="width: 390px; height: 844px; padding: 59px 20px 34px; display: flex; flex-direction: column; gap: 16px">
<div class="appbar">
<span class="wm">drktimes<span class="cur"></span></span>
<button class="ib nb" aria-label="Settings"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9M15 4v6M9 14v6"></path></svg></button>
</div>
<nav class="modes" aria-label="Mode"><button class="on" aria-pressed="true">Develop</button><button aria-pressed="false">Print</button></nav>
<div class="seg" style="grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 4px"><button>Favourites</button><button>Recent</button><button class="on">Search</button></div>

<div style="position: relative">
<label for="q" class="lbl" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Search films and developers</label>
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="position: absolute; left: 14px; top: 16px"><circle cx="11" cy="11" r="6"></circle><path d="m20 20-4.5-4.5"></path></svg>
<input id="q" class="field" value="trix" style="padding-left: 44px; border: 2px solid var(--fg)">
</div>

<div style="display: flex; flex-direction: column">
<div class="sect lbl">Films · 2</div>
<button class="li">
<span class="col sp"><span><span class="w8" style="text-decoration: underline; text-underline-offset: 4px">Tri-X</span> 400</span><span class="sm mut">Kodak · box ISO 400</span></span>
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"></path></svg>
</button>
<button class="li">
<span class="col sp"><span><span class="w8" style="text-decoration: underline; text-underline-offset: 4px">Tri-X</span> 320 (TXP)</span><span class="sm mut">Kodak · box ISO 320</span></span>
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"></path></svg>
</button>
</div>

<div style="display: flex; flex-direction: column">
<div class="sect lbl">Your combinations · Tri-X 400</div>
<button class="li">
<svg class="ic fil s" viewBox="0 0 24 24" aria-label="Favourite" role="img"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8L3.5 9.7l5.9-.8z"></path></svg>
<span class="col sp"><span class="w7">Rodinal 1+50</span><span class="sm mut">ISO 400 · 20 °C</span></span>
<span class="tm" style="font-size: 28px">13:00</span>
</button>
<button class="li">
<span style="width: 16px"></span>
<span class="col sp"><span class="w7">D-76 stock</span><span class="sm mut">ISO 400 · 20 °C</span></span>
<span class="tm" style="font-size: 28px">6:45</span>
</button>
</div>

<div class="sect lbl">Developers · 0</div>

<p class="sm mut" style="margin-top: auto; padding: 14px 16px; border: 1px dashed var(--ln2); border-radius: 3px">Spelling is forgiving: <span class="fg w7">trix</span>, <span class="fg w7">hp5</span>, <span class="fg w7">d76</span> and <span class="fg w7">r09</span> (Rodinal) all find what you mean.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","red"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
