# Put assets/icon/ in your Flutter project, merge this into pubspec.yaml
# (or keep it as flutter_launcher_icons.yaml), then: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  ios: true
  remove_alpha_ios: true
  android: "ic_launcher"
  adaptive_icon_background: "#0D0C0A"
  adaptive_icon_foreground: "assets/icon/android-foreground.png"
  adaptive_icon_monochrome: "assets/icon/android-monochrome.png"
